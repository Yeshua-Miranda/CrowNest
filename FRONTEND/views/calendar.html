<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <script src="https://kit.fontawesome.com/ae425304bc.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <header>
            <!-- place navbar here -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
                <a class="navbar-brand fw-bold"  href="home.html">
                    <img 
                        src="../assets/img/logo.png" 
                        alt="Foto de perfil" 
                        width="45" 
                        height="45" 
                        class="rounded-circle border border-2 border-secondary"
                    >
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal" aria-controls="navbarPrincipal" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarPrincipal">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="home.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="movie.html">Movies</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="calendar.html">Calendar</a>
                        </li>
                    </ul>

                    <form class="d-flex align-items-center" action="review.html" method="GET"> <!-- Dudable el get -->
                        <input 
                            class="form-control me-3" 
                            type="search" 
                            name="pelicula" 
                            placeholder="Search" 
                            aria-label="Search"
                            required
                        >
                        <button class="btn btn-outline-light me-4" type="submit">Buscar</button>
                        
                        <a href="profile.html" class="d-block" title="Ir a mi perfil">
                            <img 
                                src="../assets/img/avatar.png" 
                                alt="Foto de perfil" 
                                width="45" 
                                height="45" 
                                class="rounded-circle border border-2 border-secondary"
                            >
                        </a>
                        <button class="btn" type="button" style="cursor: pointer; color: white;" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                
                    </form>
                </div>
            </div>
        </nav>
            

        </header>
        <main class="container py-5 text-light">
            
            <div>
                <h1 class="fw-bold">Mi Diario Cinematográfico</h1>
                <p class="text-white-50">Visualiza tu actividad, películas vistas y reseñas por día.</p>
            </div>

            <div class="row g-5">
                <section class="col-lg-8">
                    
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                        
                        <div class="d-flex align-items-center gap-3">
                            <button id="prev-month" class="btn btn-outline-secondary rounded-circle"><i class="bi bi-chevron-left"></i></button>
                            <h3 id="month-year-display" class="m-0 fw-semibold">Mes y año</h3>
                            <button id="next-month" class="btn btn-outline-secondary rounded-circle"><i class="bi bi-chevron-right"></i></button>
                        </div>
                    </div>

                    <div class="calendar-container border rounded p-3 bg-dark-surface shadow">
                        <div class="calendar-header-row text-center text-uppercase fw-bold text-muted mb-3" style="font-size: 0.8rem;">
                            <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                        </div>
                        
                        <div class="calendar-days-grid" id="calendar-grid">
                            
                            
                        </div>
                    </div>

                </section>

                <aside class="col-lg-4">
                    
                    <div class="summary-card p-4 rounded border bg-dark-surface">
                        <h4 class="fw-bold mb-4">Resumen del Mes</h4>
                        
                        <div class="d-flex flex-column gap-4">
                            
                            
                            <div class="d-flex align-items-center gap-3">
                                <div class="icon-wrapper fs-2 text-purple"><i class="bi bi-film"></i></div>
                                <div>
                                    <h2 id="resumen-total" class="m-0 fw-bold">0</h2>
                                    <span class="text-white-50">Películas vistas</span>
                                </div>
                            </div>

                            
                            <div class="d-flex align-items-center gap-3">
                                <div class="icon-wrapper fs-2 text-purple"><i class="bi bi-star-fill"></i></div>
                                <div>
                                    <h2 id="resumen-promedio" class="m-0 fw-bold">0.0</h2>
                                    <span class="text-white-50">Promedio de calificación</span>
                                </div>
                            </div>

                            
                            <div class="d-flex align-items-center gap-3">
                                <div class="icon-wrapper fs-2 text-purple"><i class="bi bi-award"></i></div>
                                <div>
                                    <h4 id="resumen-obras" class="m-0 fw-bold">0</h4>
                                    <span class="text-white-50">Obras maestras (5★)</span>
                                </div>
                            </div>

                        </div>
                    </div>

                </aside>

            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

        <!-- SCRIPTS -->
         <script src="../controllers/env.js"></script>
        <script src="../controllers/auth_controller.js"></script>
        <script src="../controllers/calendar_controller.js"></script>
        <!-- ESTILOS -->
        <link rel="stylesheet" href="../assets/estilos/general.css"/>
        <link rel="stylesheet" href="../assets/estilos/calendar.css"/>

        <!-- CONTROLADORES -->
    </body>
</html>
